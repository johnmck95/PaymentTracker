<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Payee</th>
      <th>Amount</th>
      <th>Category</th>
      <th>Description</th>
    </tr>
  </thead>

  <tbody>
    @for (payment of payments(); track payment.id) {
      <tr>
        <td>{{ payment.paymentDate }}</td>
        <td>{{ payment.payee }}</td>
        <td>{{ payment.amount }}</td>
        <td>{{ payment.category }}</td>
        <td>{{ payment.description }}</td>
        <button class="delete-button" (click)="deletePayment(payment.id)">🗑️</button>
      </tr>
    }
  </tbody>
</table>

<p>Total payments: {{ payments().length }}</p>
