<form (ngSubmit)="submitPayment()">
  <div class="payment-fields">
    <input type="date" [formField]="paymentForm.paymentDate" />

    <input type="text" placeholder="Payee" [formField]="paymentForm.payee" />

    <input type="number" placeholder="Amount" step="0.01" [formField]="paymentForm.amount" />

    <select type="text" [formField]="paymentForm.category">
      @for (category of categories; track categories) {
        <option [value]="category">{{ category }}</option>
      }
    </select>

    <input type="text" placeholder="Description" [formField]="paymentForm.description" />

    <button type="submit">Record Payment</button>
  </div>
</form>
